name: mai-team

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mai}
      POSTGRES_USER: ${POSTGRES_USER:-mai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mai}
    command: ["python", "-m", "app.migrate"]
    depends_on:
      db: {condition: service_healthy}
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mai}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
    command: ["python", "-m", "app.seed"]
    profiles: ["demo"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mai}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-3000}:8080"]
    depends_on:
      backend: {condition: service_healthy}
  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mai}:${POSTGRES_PASSWORD}@test-db:5432/mai_test
      ALLOW_TEST_DB_RESET: 'true'
    command: ["python", "-m", "pytest", "-q"]
    depends_on:
      test-db: {condition: service_healthy}
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: mai_test
      POSTGRES_USER: ${POSTGRES_USER:-mai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d mai_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
