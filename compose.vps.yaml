name: mai-team-vps

# libpq reads PGPASSWORD directly, including characters reserved in URLs.
x-vps-database: &vps-database
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mai}@db:5432/${POSTGRES_DB:-mai}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  migrate:
    environment:
      <<: *vps-database
      VPS_DEMO_ENABLED: "true"
      VPS_DEMO_PASSWORD: ${VPS_DEMO_PASSWORD:-}
  db:
    ports: !reset []
    restart: unless-stopped
  test:
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mai}@test-db:5432/mai_test
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      <<: *vps-database
      # nginx replaces the forwarding header and the API has no published port.
      FORWARDED_ALLOW_IPS: "*"
      CORS_ORIGINS: ""
  frontend:
    ports: !override
      - "${VPS_BIND_IP:-0.0.0.0}:${VPS_PORT:-80}:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 5s
